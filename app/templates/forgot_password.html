<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passwort vergessen – Rechnungsworkflow</title>
  {% include "_pwa_head.html" %}
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container auth-container">
    <h1>Passwort vergessen</h1>
    <p>Ein Link zum Zurücksetzen wird an die in den Einstellungen hinterlegte Erinnerungs-E-Mail geschickt.</p>
    {% if result %}
      <p class="{% if ok %}info{% else %}warning{% endif %}">{{ result }}</p>
    {% endif %}
    <form method="post" action="/forgot-password" class="auth-form">
      <button type="submit">Reset-Link anfordern</button>
    </form>
    <p class="hint"><a href="/login">Zurück zum Login</a></p>
  </main>
</body>
</html>
