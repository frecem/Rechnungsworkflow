<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rechnungsworkflow{% endblock %}</title>
  {% include "_pwa_head.html" %}
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/board">Rechnungsworkflow</a>
    <nav>
      <a href="/board">Board</a>
      <a href="/invoices">Übersicht</a>
      <a href="/upload">Hochladen</a>
      <a href="/export/csv">CSV-Export</a>
      <a href="/settings">Einstellungen</a>
      <form method="post" action="/email-sync" style="display:inline">
        <button type="submit">E-Mails synchronisieren</button>
      </form>
      <form method="post" action="/logout" style="display:inline">
        <button type="submit">Abmelden</button>
      </form>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
