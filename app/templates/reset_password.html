<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passwort zurücksetzen – Rechnungsworkflow</title>
  {% include "_pwa_head.html" %}
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container auth-container">
    <h1>Passwort zurücksetzen</h1>
    {% if invalid %}
      <p class="warning">Der Link ist ungültig oder abgelaufen.</p>
      <p class="hint"><a href="/forgot-password">Neuen Link anfordern</a></p>
    {% else %}
      {% if error %}<p class="warning">{{ error }}</p>{% endif %}
      <form method="post" action="/reset-password" class="auth-form">
        <input type="hidden" name="token" value="{{ token }}">
        <label>Neues Passwort
          <input type="password" name="new_password" minlength="8" required autofocus>
        </label>
        <label>Neues Passwort bestätigen
          <input type="password" name="new_password_confirm" minlength="8" required>
        </label>
        <button type="submit">Passwort setzen</button>
      </form>
    {% endif %}
  </main>
</body>
</html>
